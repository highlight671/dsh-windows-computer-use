name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit and installation-guard tests
        run: node --test tests/runtime.test.mjs tests/plugin.test.mjs
      - name: Preview installation without applying it
        run: node scripts/setup-runtime.mjs
