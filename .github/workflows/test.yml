name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit and installation-guard tests
        run: node --test tests/*.test.mjs
      - name: Preview installation without applying it
        run: node scripts/setup-runtime.mjs
      - name: Install pinned host peers for native integration tests
        run: npm install --ignore-scripts --package-lock=false
      - name: Native prompt and lifecycle tests without desktop input
        run: node scripts/verify-native.mjs
